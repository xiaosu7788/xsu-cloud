# 提交级检查。对应 AGENTS.md 第 7 节的「提交级」要求，
# 以及 docs/ROADMAP.md M0 的「CI：tsc / ESLint / Prettier / Vitest 可运行」。
#
# 这里只跑不需要外部服务的检查：
# - Playwright 与 axe 属于 PR 级，随 M1 的页面一起加；
# - k6 属于里程碑级，不放进每次提交。

name: CI

on:
  push:
  pull_request:

# 同一分支只保留最新一次运行，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 提交级检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不传 version：pnpm 版本以 package.json 的 packageManager 为唯一来源。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: ESLint（含分层铁律）
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试（含分层铁律的故意失败用例）
        run: pnpm test

      - name: 校验 docker compose 配置
        env:
          POSTGRES_USER: xsu
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: xsu
        run: docker compose -f docker/docker-compose.yml config --quiet
