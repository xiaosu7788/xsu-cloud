<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>当前离线 · xsu-cloud</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <!--
      离线提示页。它必须是一个不依赖构建产物的独立静态文件：断网时页面取不到任何带哈希的
      CSS / JS，所以样式只能内联（不引外部字体、不引外链图片），也不能依赖任何脚本。
      配色取 app/globals.css 里成对的 token（浅色 #ffffff/#0a0a0a，深色 #0a0a0a/#fafafa），
      但深色只能用 prefers-color-scheme 适配 —— 这里拿不到 next-themes 打在 <html> 上的 class，
      用户在系统浅色下手动选了深色主题时，本页会跟随系统，这是可接受的降级。
    -->
    <style>
      :root {
        --background: #ffffff;
        --foreground: #0a0a0a;
        --muted-foreground: #6b6b6b;
        --border: #e5e5e5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #fafafa;
          --muted-foreground: #a1a1a1;
          --border: rgb(255 255 255 / 14%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 2rem) 1.5rem
          calc(env(safe-area-inset-bottom) + 2rem);
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans SC',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        line-height: 1.65;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: 100%;
        max-width: 24rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        line-height: 1.3;
      }

      p {
        margin: 0 0 0.75rem;
        font-size: 0.9375rem;
      }

      .muted {
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        /* 触控目标 ≥44px，与 ui/button.tsx 同一条规则。 */
        min-height: 44px;
        margin-top: 1rem;
        padding: 0 1.25rem;
        border-radius: 0.625rem;
        background: var(--foreground);
        color: var(--background);
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
      }

      .home:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>网络连接不可用，这个页面没能从网上取到。请检查网络后重试。</p>
      <p class="muted">
        站点的离线模式只提供这个提示页，不做离线数据：未加载过的页面在恢复网络前打不开。
      </p>
      <a class="home" href="/">返回首页</a>
    </main>
  </body>
</html>
